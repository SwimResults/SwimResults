# Local API gateway: mirrors production routing https://api.swimresults.de/<svc>/v1/<route> -> <svc>-service:8080/<route>
# Reachable at http://localhost:8090/<svc>/v1/ (the WebApplication JWT interceptor already allows localhost:8090).
map $http_origin $allow_origin {
    ~^https?://localhost(:[0-9]+)?$ $http_origin;
    default "";
}

server {
    listen 80;
    client_max_body_size 200m;   # import-service file uploads

    add_header Access-Control-Allow-Origin $allow_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Headers "Authorization,Accept,Origin,Content-Type,Cache-Control,X-Requested-With,X-Swimresults-Service" always;
    add_header Access-Control-Allow-Methods "GET,POST,OPTIONS,PUT,DELETE,PATCH" always;

    if ($request_method = OPTIONS) { return 204; }

    location = /nginx-health { return 200 "healthy\n"; }

    # Docker's embedded DNS, so nginx starts even if a service is down
    resolver 127.0.0.11 valid=10s;

    location ~ ^/(athlete|start|meeting|user|import|admin)/v1/(.*)$ {
        set $svc $1;
        proxy_pass http://$svc-service:8080/$2$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE progress stream (import /stream/:id)
        proxy_read_timeout 300s;
    }

    location / { return 404; }
}
